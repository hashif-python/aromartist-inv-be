name: aroma
services:
  db:
    image: postgres:16-alpine
    container_name: aroma_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-perfumosol}
      POSTGRES_USER: ${POSTGRES_USER:-perfumosol}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
  aroma_be:
    container_name: aroma_be
    image: aroma_be:local
    build: .
    ports:
      - "${AROMA_BE_PORT:-8000}:8000"
    environment:
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.development}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-development-only-perfumosol-change-before-deploying}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-perfumosol}
      POSTGRES_USER: ${POSTGRES_USER:-perfumosol}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      JWT_COOKIE_SECURE: ${JWT_COOKIE_SECURE:-0}
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-no-reply@localhost}
      WHATSAPP_API_BASE_URL: ${WHATSAPP_API_BASE_URL}
      WHATSAPP_API_KEY: ${WHATSAPP_API_KEY}
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/')"]
      interval: 15s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
    name: ${AROMA_DB_VOLUME:-aroma_postgres_data}
  static_data:
  media_data:
